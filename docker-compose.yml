# Docker Compose for KUPURI Studios - Complete Stack
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: kupuri-db
    environment:
      POSTGRES_DB: kupuri
      POSTGRES_USER: kupuri
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kupuri_development}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kupuri"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kupuri-network
    restart: unless-stopped

  # BFF Server (Hono + TypeScript)
  bff:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kupuri-bff
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://kupuri:${DB_PASSWORD:-kupuri_development}@postgres:5432/kupuri
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      CORS_ORIGIN: http://localhost:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kupuri-network
    restart: unless-stopped

  # Web Frontend (Next.js)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kupuri-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on:
      - bff
    networks:
      - kupuri-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  kupuri-network:
    driver: bridge
